plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'kotlin-kapt'
    id 'kotlin-parcelize'
}


android {
    namespace 'gov.census.cspro.csentry'
    compileSdk 36

    buildToolsVersion = '36.0.0'

    lintOptions {
        checkReleaseBuilds true
        // Or, if you prefer, you can continue to check for errors in release builds,
        // but continue the build even when errors are found:
        abortOnError false
    }

    buildFeatures {
        buildConfig true
        dataBinding true
        viewBinding true
    }

    kapt {
        arguments {
            arg("android.databinding.enableV2", "true")
        }
    }

    packagingOptions {
        jniLibs {
            // This ensures libraries are stored uncompressed and aligned
            useLegacyPackaging = false
        }
    }

    defaultConfig {
        applicationId "gov.census.cspro.csentry"
        minSdkVersion 24
        targetSdk 36
        multiDexEnabled true
        externalNativeBuild {
            ndkBuild {
                arguments "APP_STL:=c++_static","-j8", "APP_LDFLAGS+=-Wl,-z,max-page-size=16384"
                cppFlags "-frtti", "-fexceptions", "-I${file("../..").absolutePath}", "-std=c++17", "-Werror=return-type"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            debuggable false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.txt'

            packagingOptions {
                jniLibs {
                    // Explicitly do NOT keep debug symbols in release
                }
            }

            externalNativeBuild {
                ndkBuild {
                    abiFilters = ['armeabi-v7a', 'arm64-v8a']
                    arguments "NDK_DEBUG=0"
                }
            }
            ndk.debugSymbolLevel = 'full'
        }

        debug {
            packagingOptions {
                jniLibs {
                    // Only keep debug symbols for the debug build
                    //keepDebugSymbols.add("**/lib*.so")
                }
            }
            externalNativeBuild {
                ndkBuild {
                    abiFilters = ['armeabi-v7a', 'arm64-v8a', 'x86']
                    cppFlags "-DDEBUG=1", "-D_DEBUG=1"
                }
            }
            debuggable true
            jniDebuggable true
        }

    }

    externalNativeBuild {
        ndkBuild {
            path 'src/main/jni/Android.mk'
        }
    }

    signingConfigs {
        debug {
            storeFile file("../debug.keystore")
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8.toString()
    }

    ndkVersion '28.2.13676358'
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation files('libs/ftp4j-1.7.2.jar')
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.fragment:fragment-ktx:1.8.8'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.lifecycle:lifecycle-common-java8:2.9.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.9.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.9.2'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.9.2'
    implementation "androidx.activity:activity-ktx:1.10.1"
    implementation 'androidx.security:security-crypto:1.1.0'
    implementation 'androidx.multidex:multidex:2.0.1'

    implementation 'com.google.android.gms:play-services-maps:19.2.0'
    implementation 'com.google.android.gms:play-services-location:21.3.0'
    implementation 'com.google.android.gms:play-services-vision:20.1.3'
    implementation 'com.google.maps.android:android-maps-utils:0.5'

    // for Dropbox
    implementation 'com.dropbox.core:dropbox-core-sdk:7.0.0'
    implementation 'com.dropbox.core:dropbox-android-sdk:7.0.0'

    // for Google Drive
    implementation 'net.openid:appauth:0.11.1'

    // for Glide
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    implementation 'androidx.preference:preference-ktx:1.2.1'
    kapt 'com.github.bumptech.glide:compiler:4.16.0'
    implementation 'com.github.bumptech.glide:okhttp3-integration:4.16.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    implementation 'com.jayway.jsonpath:json-path:2.4.0'
    implementation 'com.jakewharton.timber:timber:4.7.1'
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.20"
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.1.0'
    implementation 'com.karumi:dexter:6.2.1'
    implementation 'io.github.gautamchibde:audiovisualizer:2.2.5'

    implementation 'androidx.webkit:webkit:1.14.0'
    implementation 'androidx.documentfile:documentfile:1.1.0'
}
