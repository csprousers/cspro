<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">

    <title>CSPro Runtime</title>

    <style>
        body {
            background-color: #0b304a;
            color: white;
        }

        a {
            color: white;
            text-decoration: none;
        }
    </style>

    <script src="runtime.js"></script>
</head>

<body>

    <h1>CSPro Runtime</h1>

    <table>
        <tr>
            <td><img src="runtime.png" width="50%" /></td>
            <td>
                <p>The CSPro Runtime can be used to run CSPro applications in a web-based application.</p>
                <p><a href="#" onclick="sendOpenMessage('application'); return false;"><img src="/images/pen-icon.png" width="64" /> Click here to open a specific application.</a></p>
                <p><a href="#" onclick="sendOpenMessage('directory'); return false;"><img src="/images/folder-icon.png" width="64" /> Click here to open a directory of applications.</a></p>
            </td>
        </tr>
    </table>

    <script>
        let CSRT;

        CSProRT.getWindow().addEventListener("message", event => {
            try {
                const message = JSON.parse(event.data);

                if( message.action == "CSProRT.activate" ) {
                    CSRT = new CSProRT(message.data.accessToken);
                }
            }
            catch(e) {
                console.log(e);
            }
        });

        function sendOpenMessage(type) {
            CSRT.postMessage("open", type);
        }
    </script>

</body>

</html>
